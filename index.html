<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />

  <title>كأس جسر · Jisr Engagement Cup</title>
  <meta name="description" content="Jisr Engagement Cup — predict the World Cup 2026, climb the individual and department leaderboards. A Jisr-native employee engagement game." />

  <style>
/* =============================================================================
   Jisr Engagement Cup — design system v2
   Themeable (light default + dark "match night"), accent presets, RTL-first.
   ============================================================================= */

:root {
  /* fixed brand accents */
  --blue:#4783FC; --blue-deep:#2C86FF; --mint:#42DCCC; --coral:#FF5636;
  --gold:#E0A93A; --gold-soft:#F4C95D;

  /* accent gradient (overridable by [data-accent]) */
  --acc1:#42DCCC; --acc2:#4783FC; --on-acc:#04130d;

  --font-latin:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"Alexandria","Noto Sans Arabic",system-ui,sans-serif;
  --font-num:"Anton","Onest",system-ui,sans-serif;
  --font-ui:var(--font-latin);

  --r:20px; --r-sm:12px; --r-pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:1140px;
}
html[dir="rtl"]{ --font-ui:var(--font-ar); }

/* ---------- accent presets ---------- */
html[data-accent="royal"]  { --acc1:#5B8DEF; --acc2:#7C5CFF; --on-acc:#ffffff; }
html[data-accent="sunset"] { --acc1:#F4C95D; --acc2:#FF7A45; --on-acc:#2a1500; }
html[data-accent="pitch"]  { --acc1:#37D67A; --acc2:#1FA85C; --on-acc:#04130d; }

/* ---------- LIGHT theme (default) ---------- */
html[data-theme="light"]{
  --bg-0:#EEF2F7; --bg-1:#F6F8FB;
  --glow-1:rgba(71,131,252,.12); --glow-2:rgba(66,220,204,.12);
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.95);
  --stroke:rgba(16,24,40,.10); --stroke-2:rgba(16,24,40,.18);
  --ink:#0E1726; --soft:#46535F; --mute:#73828F;
  --line:rgba(16,24,40,.05);
  --shadow:0 14px 40px -20px rgba(16,24,40,.30);
  --shadow-glow:0 0 0 1px var(--stroke), 0 24px 60px -26px rgba(16,24,40,.4);
  --you-bg:linear-gradient(100deg, rgba(66,220,204,.16), rgba(255,255,255,.6));
}
/* ---------- DARK theme ("match night") ---------- */
html[data-theme="dark"]{
  --bg-0:#02130d; --bg-1:#04231a;
  --glow-1:rgba(71,131,252,.16); --glow-2:rgba(66,220,204,.12);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.10); --stroke-2:rgba(255,255,255,.18);
  --ink:#F3F8F5; --soft:#CFDDD7; --mute:#9FB3A9;
  --line:rgba(66,220,204,.05);
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  --shadow-glow:0 0 0 1px var(--stroke), 0 24px 60px -22px rgba(0,0,0,.8);
  --you-bg:linear-gradient(100deg, rgba(66,220,204,.10), rgba(255,255,255,.045));
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--font-ui); color:var(--ink); min-height:100vh; position:relative; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:
    radial-gradient(1200px 640px at 80% -8%, var(--glow-1), transparent 60%),
    radial-gradient(1000px 560px at 8% 4%, var(--glow-2), transparent 55%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment:fixed;
}
body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:repeating-linear-gradient(90deg, transparent 0 78px, var(--line) 78px 79px);
  mask-image:radial-gradient(120% 90% at 50% 0%, #000 35%, transparent 85%); }
#app{ position:relative; z-index:1; }

.wrap{ width:100%; max-width:var(--maxw); margin:0 auto; padding:0 22px; }
.row{ display:flex; align-items:center; gap:12px; } .between{ justify-content:space-between; }
.col{ display:flex; flex-direction:column; } .grow{ flex:1; }
.muted{ color:var(--mute); } .soft{ color:var(--soft); } .center{ text-align:center; } .hidden{ display:none !important; }

.eyebrow{ font-size:12px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--blue); }
html[dir="rtl"] .eyebrow{ letter-spacing:1px; }
.h1{ font-size:clamp(30px,5vw,54px); font-weight:800; line-height:1.02; letter-spacing:-.5px; }
.h2{ font-size:clamp(22px,3vw,30px); font-weight:800; letter-spacing:-.3px; }
.h3{ font-size:17px; font-weight:700; }
.lede{ font-size:17px; color:var(--soft); line-height:1.55; }
.num{ font-family:var(--font-num); }
html[dir="rtl"] .num{ font-family:var(--font-ar); font-weight:800; }

/* ---------- header ---------- */
.topbar{ position:sticky; top:0; z-index:40; backdrop-filter:blur(14px) saturate(1.2);
  background:color-mix(in srgb, var(--bg-1) 78%, transparent); border-bottom:1px solid var(--stroke); }
.topbar .wrap{ min-height:64px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:11px; font-weight:800; cursor:pointer; }
.brand .crest{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
  background:conic-gradient(from 210deg, var(--acc1), var(--acc2), var(--gold-soft), var(--acc1)); color:#04130d; font-size:18px; }
.brand b{ font-size:15.5px; }
.sync-chip{ display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--mint) 12%, transparent); border:1px solid color-mix(in srgb, var(--mint) 35%, transparent);
  font-size:12px; font-weight:700; color:color-mix(in srgb, var(--mint) 70%, var(--ink)); }
.sync-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--mint); animation:pulse 2.2s infinite; }
.toolbtn{ border:1px solid var(--stroke-2); background:var(--glass); color:var(--soft); border-radius:var(--r-pill);
  padding:7px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.2s var(--ease); }
.toolbtn:hover{ color:var(--ink); border-color:var(--acc1); }
.idtag{ display:flex; align-items:center; gap:9px; cursor:pointer; }
.idtag .meta b{ font-size:13px; display:block; line-height:1.1; } .idtag .meta small{ color:var(--mute); font-size:11px; }
.swatches{ display:flex; gap:6px; align-items:center; }
.sw{ width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid var(--stroke-2); }
.sw.on{ outline:2px solid var(--ink); outline-offset:1px; }

/* ---------- tabs ---------- */
.tabs{ display:flex; gap:6px; padding:9px 0 2px; flex-wrap:wrap; }
.tab{ border:1px solid transparent; background:transparent; color:var(--mute); padding:9px 14px; border-radius:var(--r-pill);
  font:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:.2s var(--ease); display:inline-flex; align-items:center; gap:7px; }
.tab:hover{ color:var(--ink); background:var(--glass); }
.tab.active{ color:var(--on-acc); background:linear-gradient(120deg,var(--acc1),var(--acc2)); box-shadow:0 10px 24px -14px var(--acc1); }
.tab .ic{ font-size:15px; }

/* ---------- segmented ---------- */
.seg{ display:inline-flex; gap:4px; padding:4px; border-radius:var(--r-pill); background:var(--glass); border:1px solid var(--stroke); }
.seg button{ border:none; background:transparent; color:var(--mute); font:inherit; font-weight:700; font-size:13.5px;
  padding:8px 16px; border-radius:var(--r-pill); cursor:pointer; transition:.18s var(--ease); }
.seg button.on{ color:var(--on-acc); background:linear-gradient(120deg,var(--acc1),var(--acc2)); }
.seg button:not(.on):hover{ color:var(--ink); }

/* ---------- cards / buttons ---------- */
.card{ background:var(--glass); border:1px solid var(--stroke); border-radius:var(--r); box-shadow:var(--shadow); }
.card.pad{ padding:20px; }
.card-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.btn{ appearance:none; border:1px solid var(--stroke-2); background:var(--glass-2); color:var(--ink); font:inherit; font-weight:700;
  font-size:14px; padding:11px 18px; border-radius:var(--r-pill); cursor:pointer; transition:.18s var(--ease); display:inline-flex; align-items:center; gap:9px; white-space:nowrap; }
.btn:hover{ transform:translateY(-1px); } .btn:active{ transform:none; }
.btn-primary{ background:linear-gradient(120deg,var(--acc1),var(--acc2)); color:var(--on-acc); border:none; box-shadow:0 14px 30px -16px var(--acc1); }
.btn-gold{ background:linear-gradient(120deg,var(--gold-soft),var(--gold)); color:#2a1d00; border:none; }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:8px 13px; font-size:13px; } .btn-lg{ padding:14px 26px; font-size:15.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.divider{ height:1px; background:var(--stroke); margin:24px 0; border:0; }

.avatar{ width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:14px; flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10); }
.dept-chip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--soft);
  padding:3px 9px 3px 6px; border-radius:var(--r-pill); background:var(--glass); border:1px solid var(--stroke); }
.dept-chip .swatch{ width:9px; height:9px; border-radius:3px; flex:none; }
.badge{ font-size:11px; font-weight:800; letter-spacing:.4px; padding:3px 9px; border-radius:var(--r-pill); text-transform:uppercase; }
.badge.live{ color:var(--coral); background:color-mix(in srgb,var(--coral) 14%,transparent); border:1px solid color-mix(in srgb,var(--coral) 32%,transparent); }
.badge.open{ color:color-mix(in srgb,var(--mint) 75%,var(--ink)); background:color-mix(in srgb,var(--mint) 12%,transparent); border:1px solid color-mix(in srgb,var(--mint) 30%,transparent); }
.badge.done{ color:var(--mute); background:var(--glass); border:1px solid var(--stroke); }
.badge.exact{ color:var(--gold); background:color-mix(in srgb,var(--gold-soft) 16%,transparent); border:1px solid color-mix(in srgb,var(--gold-soft) 38%,transparent); }

/* ---------- hero ---------- */
.hero{ padding:clamp(36px,8vh,84px) 0 50px; position:relative; }
.hero .eyebrow{ margin-bottom:16px; }
.hero .h1{ max-width:18ch; margin:0 0 18px; }
.hero .h1 .accent{ background:linear-gradient(110deg,var(--acc1),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero .lede{ max-width:54ch; margin-bottom:28px; }
.hero-cta{ display:flex; gap:14px; flex-wrap:wrap; }
.hero-stats{ display:flex; gap:30px; margin-top:42px; flex-wrap:wrap; }
.hero-stat .v{ font-family:var(--font-num); font-size:40px; line-height:1; }
html[dir="rtl"] .hero-stat .v{ font-family:var(--font-ar); font-weight:800; }
.hero-stat .k{ font-size:12.5px; color:var(--mute); margin-top:7px; font-weight:600; }
.trophy-orb{ position:absolute; inset-inline-end:0; top:30px; width:min(40vw,420px); aspect-ratio:1; pointer-events:none; z-index:0;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--gold-soft) 22%,transparent), transparent 70%),
            radial-gradient(closest-side at 60% 40%, color-mix(in srgb,var(--acc2) 22%,transparent), transparent 72%); filter:blur(8px); }

.persona-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.persona{ text-align:start; padding:14px; border-radius:var(--r-sm); cursor:pointer; background:var(--glass); border:1px solid var(--stroke);
  transition:.18s var(--ease); display:flex; gap:11px; align-items:center; }
.persona:hover{ border-color:var(--acc1); transform:translateY(-2px); }
.persona b{ font-size:14px; display:block; } .persona small{ color:var(--mute); font-size:11.5px; display:block; }
.field-label{ font-size:12px; color:var(--mute); margin-bottom:6px; display:block; }
.input,select.input{ width:100%; border:1px solid var(--stroke-2); background:var(--glass-2); color:var(--ink); border-radius:var(--r-pill);
  padding:11px 16px; font:inherit; font-size:14px; }

/* ---------- matches / predict ---------- */
.section-h{ display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 14px; gap:14px; flex-wrap:wrap; }
.matchday-rail{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px; scrollbar-width:none; }
.matchday-rail::-webkit-scrollbar{ display:none; }
.md-pill{ border:1px solid var(--stroke); background:var(--glass); color:var(--soft); border-radius:var(--r-pill); padding:8px 15px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; transition:.18s var(--ease); }
.md-pill.active{ background:var(--ink); color:var(--bg-0); border-color:var(--ink); }
.md-pill:hover:not(.active){ border-color:var(--acc1); color:var(--ink); }
.matches{ display:grid; gap:14px; } @media(min-width:760px){ .matches{ grid-template-columns:1fr 1fr; } }
.match{ background:var(--glass); border:1px solid var(--stroke); border-radius:var(--r); padding:16px 18px; position:relative; overflow:hidden; transition:.2s var(--ease); }
.match:hover{ border-color:var(--stroke-2); }
.match .accent-bar{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; opacity:.85; }
.match .meta-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:12px; color:var(--mute); font-weight:600; }
.teams{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
.team{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.team .flag{ font-size:38px; line-height:1; filter:drop-shadow(0 6px 12px rgba(0,0,0,.25)); }
.team .name{ font-size:13.5px; font-weight:700; } .team .code{ font-size:11px; color:var(--mute); font-weight:700; letter-spacing:1px; }
.vs{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--mute); }
.vs .score{ font-family:var(--font-num); font-size:30px; color:var(--ink); letter-spacing:1px; }
.vs .vs-lbl{ font-size:11px; font-weight:800; letter-spacing:2px; }
.kickoff{ text-align:center; font-size:12px; color:var(--mute); margin-top:12px; }
.predict{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:14px; }
.stepper{ display:flex; align-items:center; justify-content:center; gap:10px; }
.step-btn{ width:30px; height:30px; border-radius:9px; border:1px solid var(--stroke-2); background:var(--glass-2); color:var(--ink); font-size:18px; font-weight:700; cursor:pointer; display:grid; place-items:center; transition:.15s var(--ease); }
.step-btn:hover{ border-color:var(--acc1); color:var(--acc2); }
.step-val{ font-family:var(--font-num); font-size:30px; min-width:28px; text-align:center; }
.predict-mid{ font-size:11px; color:var(--mute); font-weight:800; }
.match-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; gap:10px; }
.your-pred{ font-size:12.5px; color:var(--soft); } .your-pred b{ color:color-mix(in srgb,var(--mint) 70%,var(--ink)); font-family:var(--font-num); font-size:15px; }
.pts-won{ font-size:12.5px; font-weight:800; } .pts-won.hit{ color:var(--gold); } .pts-won.partial{ color:color-mix(in srgb,var(--mint) 70%,var(--ink)); } .pts-won.miss{ color:var(--mute); }

/* ---------- leaderboard ---------- */
.lb-head{ display:grid; grid-template-columns:54px 1fr auto; gap:12px; padding:6px 16px; color:var(--mute); font-size:11.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
.lb{ display:flex; flex-direction:column; gap:8px; }
.lb-row{ display:grid; grid-template-columns:54px 1fr auto; gap:12px; align-items:center; padding:12px 16px; border-radius:var(--r-sm); background:var(--glass); border:1px solid var(--stroke); transition:.25s var(--ease); }
.lb-row.you{ border-color:var(--acc1); background:var(--you-bg); box-shadow:0 0 0 1px color-mix(in srgb,var(--acc1) 30%,transparent); }
.lb-row .rank{ display:flex; align-items:center; gap:7px; font-family:var(--font-num); font-size:20px; color:var(--soft); }
.lb-row .rank .mv{ font-size:11px; font-family:var(--font-ui); font-weight:800; }
.mv.up{ color:var(--mint); } .mv.down{ color:var(--coral); } .mv.same{ color:var(--mute); }
.lb-row .who{ display:flex; align-items:center; gap:11px; min-width:0; }
.lb-row .who .nm{ min-width:0; } .lb-row .who .nm b{ font-size:14.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb-row .pts{ font-family:var(--font-num); font-size:24px; color:var(--ink); text-align:end; }
.lb-row .pts small{ font-size:11px; color:var(--mute); font-family:var(--font-ui); font-weight:700; }
.podium{ display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:12px; align-items:end; margin-bottom:22px; }
.pod{ border-radius:var(--r); padding:18px 14px; text-align:center; position:relative; border:1px solid var(--stroke); background:var(--glass); }
.pod .medal{ font-size:24px; } .pod .avatar{ width:56px; height:56px; margin:8px auto 10px; font-size:19px; }
.pod .pnm{ font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pod .ppts{ font-family:var(--font-num); font-size:30px; margin-top:4px; }
.pod.p1{ border-color:color-mix(in srgb,var(--gold-soft) 50%,transparent); background:color-mix(in srgb,var(--gold-soft) 14%,var(--glass)); transform:translateY(-10px); }
.pod.p1 .ppts{ color:var(--gold); } .pod.p2 .ppts{ color:#8aa0b5; } .pod.p3 .ppts{ color:#c08552; }
.pod .pillar{ font-family:var(--font-num); font-size:13px; color:var(--mute); margin-top:8px; }

.dept-row{ display:grid; grid-template-columns:48px 1fr 160px auto; gap:14px; align-items:center; padding:14px 16px; border-radius:var(--r-sm); background:var(--glass); border:1px solid var(--stroke); transition:.2s var(--ease); cursor:pointer; }
.dept-row:hover{ border-color:var(--stroke-2); }
.dept-row.you{ border-color:var(--acc1); }
.dept-row .rank{ font-family:var(--font-num); font-size:22px; color:var(--soft); }
.dept-crest{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; font-weight:800; font-size:15px; }
.dept-meta b{ font-size:14.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw; } .dept-meta small{ color:var(--mute); font-size:12px; }
.avg-bar{ height:9px; border-radius:var(--r-pill); background:var(--glass-2); overflow:hidden; border:1px solid var(--stroke); }
.avg-bar>i{ display:block; height:100%; border-radius:var(--r-pill); }
.dept-row .avg-val{ font-family:var(--font-num); font-size:22px; text-align:end; }
.dept-row .avg-val small{ font-size:11px; color:var(--mute); font-family:var(--font-ui); font-weight:700; display:block; }

/* ---------- news / articles ---------- */
.news-grid{ display:grid; gap:16px; } @media(min-width:760px){ .news-grid{ grid-template-columns:1fr 1fr; } }
.article-card{ border-radius:var(--r); border:1px solid var(--stroke); background:var(--glass); overflow:hidden; cursor:pointer; transition:.2s var(--ease); }
.article-card:hover{ transform:translateY(-3px); border-color:var(--acc1); box-shadow:var(--shadow); }
.article-cover{ height:120px; display:grid; place-items:center; font-size:52px; background:linear-gradient(120deg,color-mix(in srgb,var(--acc1) 22%,var(--glass)),color-mix(in srgb,var(--acc2) 22%,var(--glass))); }
.article-card .body{ padding:16px 18px; }
.article-card .wk{ font-size:11px; font-weight:800; letter-spacing:.5px; color:var(--blue); text-transform:uppercase; }
.article-card h3{ margin:6px 0 8px; font-size:18px; } .article-card p{ margin:0; color:var(--soft); font-size:13.5px; line-height:1.55; }
.article-card .by{ margin-top:12px; font-size:12px; color:var(--mute); }
.article-full{ max-width:760px; } .article-full .article-cover{ height:160px; font-size:64px; border-radius:var(--r); margin-bottom:18px; }
.article-full p.bd{ font-size:16px; line-height:1.8; color:var(--soft); }

/* ---------- comments ---------- */
.comment-form{ display:flex; gap:10px; margin:14px 0 18px; } .comment-form .input{ border-radius:var(--r-sm); }
.comments{ display:flex; flex-direction:column; gap:10px; }
.comment{ display:flex; gap:11px; padding:13px 15px; border-radius:var(--r-sm); background:var(--glass); border:1px solid var(--stroke); }
.comment .c-body{ flex:1; min-width:0; }
.comment .c-top{ display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
.comment .c-top b{ font-size:13.5px; } .comment .c-top .t{ color:var(--mute); font-size:11.5px; }
.comment .c-text{ font-size:14px; line-height:1.5; color:var(--ink); }
.comment .c-actions{ display:flex; gap:14px; margin-top:8px; font-size:12px; color:var(--mute); }
.comment .c-actions button{ background:none; border:none; color:var(--mute); cursor:pointer; font:inherit; font-size:12px; display:inline-flex; gap:5px; align-items:center; }
.comment .c-actions button:hover{ color:var(--ink); } .comment .c-actions .del:hover{ color:var(--coral); }
.comment.hidden-c{ opacity:.5; } .comment .modtag{ font-size:10px; color:var(--coral); font-weight:800; }

/* ---------- admin ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
.stat{ padding:16px; border-radius:var(--r-sm); background:var(--glass); border:1px solid var(--stroke); }
.stat .v{ font-family:var(--font-num); font-size:34px; line-height:1; } .stat .k{ color:var(--mute); font-size:12px; margin-top:6px; font-weight:600; }
.stat .v.mint{ color:color-mix(in srgb,var(--mint) 70%,var(--ink)); } .stat .v.blue{ color:var(--blue); } .stat .v.gold{ color:var(--gold); }
.funnel{ display:flex; flex-direction:column; gap:8px; margin:6px 0 18px; }
.funnel .f-row{ display:grid; grid-template-columns:120px 1fr 60px; gap:12px; align-items:center; font-size:13px; }
.funnel .f-bar{ height:24px; border-radius:8px; background:var(--glass-2); border:1px solid var(--stroke); overflow:hidden; }
.funnel .f-bar>i{ display:block; height:100%; background:linear-gradient(90deg,var(--acc1),var(--acc2)); }
.atable{ width:100%; border-collapse:collapse; font-size:13.5px; }
.atable th{ text-align:start; color:var(--mute); font-weight:700; font-size:11.5px; text-transform:uppercase; padding:8px 12px; border-bottom:1px solid var(--stroke); }
.atable td{ padding:10px 12px; border-bottom:1px solid var(--line); }
.atable tr:hover td{ background:var(--glass); }
.dot-status{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-inline-end:6px; }
.dot-status.on{ background:var(--mint); } .dot-status.idle{ background:var(--gold-soft); } .dot-status.off{ background:var(--mute); }

/* ---------- rules ---------- */
.rules{ max-width:780px; } .rule-block{ padding:18px 20px; border-radius:var(--r); background:var(--glass); border:1px solid var(--stroke); margin-bottom:14px; }
.rule-block h3{ margin:0 0 8px; display:flex; gap:9px; align-items:center; }
.rule-block p,.rule-block li{ color:var(--soft); font-size:14.5px; line-height:1.7; }
.score-ex{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
.score-ex .ex{ flex:1; min-width:170px; padding:14px; border-radius:var(--r-sm); border:1px solid var(--stroke); background:var(--glass-2); text-align:center; }
.score-ex .ex .big{ font-family:var(--font-num); font-size:26px; } .score-ex .ex.hit .big{ color:var(--gold); } .score-ex .ex.part .big{ color:color-mix(in srgb,var(--mint) 70%,var(--ink)); } .score-ex .ex.miss .big{ color:var(--mute); }

/* ---------- director ---------- */
.director-toggle{ position:fixed; inset-block-end:22px; inset-inline-end:22px; z-index:60; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:#2a1d00; font-size:22px; box-shadow:0 16px 34px -12px var(--gold); display:grid; place-items:center; transition:.2s var(--ease); }
.director-toggle:hover{ transform:scale(1.06) rotate(8deg); }
.director{ position:fixed; inset-block-end:88px; inset-inline-end:22px; z-index:60; width:min(92vw,360px);
  background:color-mix(in srgb,var(--bg-1) 96%, #000 4%); backdrop-filter:blur(16px); border:1px solid var(--stroke-2); border-radius:var(--r); box-shadow:var(--shadow-glow); padding:18px;
  transform:translateY(12px) scale(.98); opacity:0; pointer-events:none; transition:.24s var(--ease); }
.director.open{ transform:none; opacity:1; pointer-events:auto; }
.director h4{ margin:0 0 4px; font-size:15px; display:flex; gap:8px; align-items:center; } .director .sub{ font-size:12px; color:var(--mute); margin-bottom:14px; }
.director .next-match{ background:var(--glass); border:1px solid var(--stroke); border-radius:var(--r-sm); padding:12px; margin-bottom:12px; }
.director .dir-actions{ display:grid; gap:8px; } .director .dir-row{ display:flex; gap:8px; } .director .dir-row .btn{ flex:1; justify-content:center; padding:10px; font-size:13px; }

/* ---------- misc ---------- */
.foot{ padding:40px 0 120px; color:var(--mute); font-size:12.5px; text-align:center; line-height:1.7; }
.toast-wrap{ position:fixed; inset-block-start:74px; inset-inline:0; z-index:80; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.toast{ background:var(--ink); color:var(--bg-0); font-weight:800; font-size:13.5px; padding:11px 18px; border-radius:var(--r-pill); box-shadow:var(--shadow);
  transform:translateY(-10px); opacity:0; animation:toastIn .4s var(--ease) forwards, toastOut .4s var(--ease) 2.6s forwards; }
.toast.gold{ background:linear-gradient(120deg,var(--gold-soft),var(--gold)); color:#2a1d00; }
#confetti{ position:fixed; inset:0; z-index:90; pointer-events:none; }
.empty{ text-align:center; color:var(--mute); padding:48px 20px; }
.reveal{ opacity:0; transform:translateY(14px); animation:fadeUp .6s var(--ease) forwards; }
.stagger>*{ opacity:0; transform:translateY(12px); animation:fadeUp .55s var(--ease) forwards; }
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.07s}.stagger>*:nth-child(3){animation-delay:.11s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.19s}.stagger>*:nth-child(6){animation-delay:.23s}.stagger>*:nth-child(n+7){animation-delay:.27s}

@keyframes fadeUp{ to{ opacity:1; transform:none; } }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 50%,transparent);} 70%{ box-shadow:0 0 0 7px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
@keyframes toastIn{ to{ transform:translateY(0); opacity:1; } } @keyframes toastOut{ to{ transform:translateY(-10px); opacity:0; } }

@media(max-width:720px){
  .podium{ grid-template-columns:1fr 1fr 1fr; }
  .dept-row{ grid-template-columns:36px 1fr auto; } .dept-row .avg-bar-wrap{ display:none; }
  .funnel .f-row{ grid-template-columns:90px 1fr 48px; }
  .atable .hide-sm{ display:none; }
}

  const ranksMap = (st) => { const m={}; st.forEach(r=> m[r.p.id]=r.rank); return m; };
  function departments() {
    const by={}; for(const p of SEED.participants){ (by[p.deptId]=by[p.deptId]||[]).push(p); }
    const rows = SEED.departments.map(d=>{ const mem=by[d.id]||[]; let sum=0,ex=0; mem.forEach(p=>{const s=ppoints(p.id);sum+=s.pts;ex+=s.exact;}); const n=mem.length; return { d, n, sum, exact:ex, avg:n?sum/n:0 }; });
    const ranked = rows.filter(r=>r.n>=SEED.meta.deptMinParticipation).sort((a,b)=>b.avg-a.avg||b.exact-a.exact); ranked.forEach((r,i)=>r.rank=i+1);
    const pending = rows.filter(r=>r.n<SEED.meta.deptMinParticipation);
    return { ranked, pending, maxAvg: ranked.length?ranked[0].avg:1 };
  }
  function locations() {
    const by={}; for(const p of SEED.participants){ if(p.locationId==null) continue; (by[p.locationId]=by[p.locationId]||[]).push(p); }
    const rows = (SEED.locations||[]).map(l=>{ const mem=by[l.id]||[]; let sum=0,ex=0; mem.forEach(p=>{const s=ppoints(p.id);sum+=s.pts;ex+=s.exact;}); return { l, n:mem.length, sum, exact:ex }; })
      .filter(r=>r.n>0).sort((a,b)=>b.sum-a.sum||b.exact-a.exact); rows.forEach((r,i)=>r.rank=i+1);
    return { rows, maxSum: rows.length?rows[0].sum:1 };
  }
  function activity() {
    const joined = SEED.participants.length, invited = SEED.meta.invitedCount || joined;
    const active = SEED.participants.filter(p => (p.lastActiveDays!=null?p.lastActiveDays:99) <= 7).length;
    const predicted = SEED.participants.filter(p => predCount(p.id) > 0).length;
    return { invited, joined, active, predicted };
  }

  /* ---------------- formatting ---------------- */
  function fmtKick(iso){ try{ const loc=L()==='ar'?'ar':'en-GB'; return new Intl.DateTimeFormat(loc,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Riyadh',calendar:'gregory',numberingSystem:'latn'}).format(new Date(iso)); }catch(e){ return iso.slice(0,16).replace('T',' '); } }
  function fmtDate(d){ try{ return new Intl.DateTimeFormat(L()==='ar'?'ar':'en-GB',{day:'numeric',month:'long',year:'numeric',calendar:'gregory',numberingSystem:'latn'}).format(new Date(d)); }catch(e){ return d; } }
  function ago(days){ if(days<=0) return t('just_now'); if(days===1) return L()==='ar'?'أمس':'1d ago'; return L()==='ar'? ('قبل '+days+' يوم') : (days+'d ago'); }
  const esc = (s) => (''+s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function avatarEl(p, cls){ return `<div class="avatar ${cls||''}" style="background:${p.color};color:${textOn(p.color)}">${esc(p.initials||'•')}</div>`; }
  function deptChip(d){ if(!d) return ''; return `<span class="dept-chip"><i class="swatch" style="background:${d.color}"></i>${esc(nm(d))}</span>`; }

  /* ======================================================= VIEWS */
  function viewHome() {
    const ind = individual(); const myRow = me()? ind.find(r=>r.p.id===me().id):null;
    const dep = departments(); const myDeptRank = me()? (dep.ranked.find(r=>r.d.id===me().deptId)||{}).rank : null;
    const heroStats = `<div class="hero-stats stagger">
      <div class="hero-stat"><div class="v num" data-count="${SEED.meta.participantsCount}">0</div><div class="k">${t('stat_players')}</div></div>
      <div class="hero-stat"><div class="v num" data-count="${SEED.meta.departmentsSynced}">0</div><div class="k">${t('stat_depts')}</div></div>
      <div class="hero-stat"><div class="v num" data-count="${SEED.meta.locationsSynced}">0</div><div class="k">${t('stat_locs')}</div></div>
      <div class="hero-stat"><div class="v num" data-count="${SEED.matches.length}">0</div><div class="k">${t('stat_matches')}</div></div></div>`;

    let panel;
    if (!me()) { panel = joinPanel(); }
    else {
      panel = `<div class="card pad reveal" style="margin-top:28px">
        <div class="row between" style="flex-wrap:wrap;gap:16px">
          <div class="row" style="gap:14px">${avatarEl(me())}
            <div><div class="muted" style="font-size:12px">${t('welcome')}</div><b style="font-size:18px">${esc(nm(me()))}</b> ${deptChip(deptMap[me().deptId])}</div></div>
          <div class="row" style="gap:24px">
            <div class="center"><div class="num" style="font-size:30px;color:var(--gold)">#${myRow?myRow.rank:'—'}</div><div class="muted" style="font-size:11px">${t('your_rank')}</div></div>
            <div class="center"><div class="num" style="font-size:30px">${myRow?myRow.pts:0}</div><div class="muted" style="font-size:11px">${t('your_pts')}</div></div>
            <div class="center"><div class="num" style="font-size:30px;color:color-mix(in srgb,var(--mint) 70%,var(--ink))">${myRow?myRow.exact:0}</div><div class="muted" style="font-size:11px">${t('exact_hits')}</div></div>
            <div class="center"><div class="num" style="font-size:30px">#${myDeptRank||'—'}</div><div class="muted" style="font-size:11px">${t('dept_rank')}</div></div></div></div>
        <hr class="divider"/>
        <div class="row" style="gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" data-nav="predict">⚽ ${t('cta_predict')}</button>
          <button class="btn" data-nav="lb">🏆 ${t('cta_lb')}</button>
          <button class="btn btn-ghost" data-action="change-id">${t('change_id')}</button></div></div>`;
    }
    const art = (SEED.articles||[])[SEED.articles.length-1];
    const extras = `<div class="news-grid reveal" style="margin-top:16px">
      <div class="article-card" data-action="goto-rules"><div class="article-cover">🎯</div><div class="body"><div class="wk">${t('how_card')}</div><h3 style="margin:6px 0 6px">${t('rules_title')}</h3><p>${t('how_card_sub')}</p></div></div>
      ${art?`<div class="article-card" data-article="${art.id}"><div class="article-cover">${art.cover||'📰'}</div><div class="body"><div class="wk">${t('latest_news')} · ${t('week_label')} ${art.week}</div><h3 style="margin:6px 0 6px">${esc(L()==='ar'?art.title_ar:art.title_en)}</h3><p>${esc(L()==='ar'?art.excerpt_ar:art.excerpt_en)}</p></div></div>`:''}
    </div>`;

    return `<div class="hero wrap"><div class="trophy-orb"></div>
      <div class="eyebrow reveal">${t('hero_eyebrow')}</div>
      <h1 class="h1 reveal">${t('hero_h1a')} <span class="accent">${t('hero_h1b')}</span></h1>
      <p class="lede reveal">${t('hero_lede')}</p>
      ${!me()?`<div class="hero-cta reveal"><button class="btn btn-primary btn-lg" data-action="scroll-join">${t('cta_join')}</button><button class="btn btn-lg" data-nav="lb">${t('cta_lb')}</button></div>`:''}
      ${heroStats}</div>
      <div class="wrap" id="join-anchor">${panel}${extras}</div>${footer()}`;
  }

  function joinPanel() {
    const personas = (SEED.personaIds||[]).map(id=>partMap.get(id)).filter(Boolean);
    const pc = personas.map(p=>{ const s=ppoints(p.id); return `<button class="persona" data-pick="${p.id}">${avatarEl(p)}<div><b>${esc(nm(p))}</b><small>${esc(nm(deptMap[p.deptId]))}</small><small style="color:color-mix(in srgb,var(--mint) 70%,var(--ink))">${s.pts} ${t('pts')}</small></div></button>`; }).join('');
    const dOpts = SEED.departments.map(d=>`<option value="${d.id}">${esc(nm(d))}</option>`).join('');
    const lOpts = (SEED.locations||[]).map(l=>`<option value="${l.id}">${esc(locName(l))}${locCity(l)?' · '+esc(locCity(l)):''}</option>`).join('');
    return `<div class="card pad reveal" style="margin-top:28px">
      <div class="card-h"><div><div class="h2">${t('join_title')}</div><div class="muted" style="font-size:13.5px;margin-top:4px">${t('join_sub')}</div></div></div>
      <div class="persona-grid">${pc}</div><hr class="divider"/>
      <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
        <div class="col grow" style="min-width:160px"><label class="field-label">${t('your_name')}</label><input id="me-name" class="input" placeholder="${L()==='ar'?'مثال: محمد الغامدي':'e.g. Mohammed Al-Ghamdi'}"/></div>
        <div class="col grow" style="min-width:150px"><label class="field-label">${t('your_dept')}</label><select id="me-dept" class="input">${dOpts}</select></div>
        <div class="col grow" style="min-width:150px"><label class="field-label">${t('your_loc')}</label><select id="me-loc" class="input">${lOpts}</select></div>
        <button class="btn btn-gold" data-action="create-id">${t('enter')}</button></div></div>`;
  }

  function viewPredict() {
    if (!me()) return guardJoin();
    const rail = SEED.matchdays.map(md=>`<button class="md-pill ${md===selMd?'active':''}" data-md="${md}">${t('md')} ${md}</button>`).join('');
    const list = SEED.matches.filter(m=>m.matchday===selMd).sort((a,b)=>a.kickoffKSA.localeCompare(b.kickoffKSA));
    return `<div class="wrap"><div class="section-h"><div><div class="eyebrow">${t('nav_predict')}</div><div class="h2">${nm(SEED.meta.tournament)} — ${t('md')} ${selMd}</div></div>
      <button class="btn btn-sm btn-ghost" data-action="goto-rules">🎯 ${t('rules_title')}</button></div>
      <div class="matchday-rail">${rail}</div><div class="matches stagger">${list.map(matchCard).join('')||`<div class="empty">—</div>`}</div></div>${footer()}`;
  }
  function matchCard(m) {
    const H=team(m.home),A=team(m.away); const preds=me()?(SEED.predictions[me().id]||{}):{}; const pr=preds[m.id]; const isOpen=m.status==='upcoming';
    const badge = m.status==='live'?`<span class="badge live">● ${t('live_b')}</span>`:m.status==='finished'?`<span class="badge done">${t('done_b')}</span>`:`<span class="badge open">${t('open_b')}</span>`;
    const mid = (m.status==='finished'||m.status==='live')?`<div class="vs"><div class="score">${m.homeScore} : ${m.awayScore}</div><div class="vs-lbl">${m.status==='live'?t('live_b'):''}</div></div>`:`<div class="vs"><div class="vs-lbl">VS</div></div>`;
    const teams=`<div class="teams"><div class="team"><div class="flag">${H.flag}</div><div class="name">${esc(nm(H))}</div><div class="code">${esc(H.code)}</div></div>${mid}<div class="team"><div class="flag">${A.flag}</div><div class="name">${esc(nm(A))}</div><div class="code">${esc(A.code)}</div></div></div>`;
    let foot='';
    if (isOpen) { const ph=pr?pr.h:0,pa=pr?pr.a:0;
      foot=`<div class="predict" data-match="${m.id}"><div class="stepper"><button class="step-btn" data-step="-1" data-side="h">−</button><div class="step-val" data-val="h">${ph}</div><button class="step-btn" data-step="1" data-side="h">+</button></div><div class="predict-mid">${t('your_pred')}</div><div class="stepper"><button class="step-btn" data-step="-1" data-side="a">−</button><div class="step-val" data-val="a">${pa}</div><button class="step-btn" data-step="1" data-side="a">+</button></div></div>
        <div class="match-foot"><span class="your-pred">${pr?`${t('your_pred')}: <b>${pr.h}–${pr.a}</b>`:`<span class="muted">${t('tap_predict')}</span>`}</span><span class="muted" style="font-size:12px">🔒 ${t('lock_at')}</span></div>`;
    } else { const r=pr?matchPoints(pr,m):null;
      const lbl = !pr?`<span class="muted">${t('no_pred')}</span>`: r.kind==='exact'?`<span class="pts-won hit">★ ${t('pts_exact')}</span>`: r.kind==='outcome'?`<span class="pts-won partial">${t('pts_out')}</span>`: m.status==='finished'?`<span class="pts-won miss">${t('pts_miss')}</span>`:`<span class="your-pred">${t('your_pred')}: <b>${pr.h}–${pr.a}</b></span>`;
      foot=`<div class="match-foot"><span class="your-pred">${pr?`${t('your_pred')}: <b>${pr.h}–${pr.a}</b>`:''}</span>${lbl}</div>`;
    }
    const ac = m.status==='live'?'var(--coral)':m.status==='upcoming'?'var(--mint)':'var(--mute)';
    return `<div class="match ${m.status}"><div class="accent-bar" style="background:${ac}"></div><div class="meta-top"><span>${t('group')} ${m.group}</span>${badge}</div>${teams}<div class="kickoff">${fmtKick(m.kickoffKSA)}${m.city?' · '+esc(m.city):''}</div>${foot}</div>`;
  }

  /* ---- leaderboard (players / depts / locations) ---- */
  function viewLeaderboard() {
    if (selDept != null) return viewDeptDetail();
    const seg = `<div class="seg"><button class="${lbTab==='players'?'on':''}" data-lb="players">${t('seg_players')}</button><button class="${lbTab==='depts'?'on':''}" data-lb="depts">${t('seg_depts')}</button><button class="${lbTab==='locs'?'on':''}" data-lb="locs">${t('seg_locs')}</button></div>`;
    let body, sub;
    if (lbTab==='depts'){ sub=t('dept_sub'); body=lbDepts(); }
    else if (lbTab==='locs'){ sub=t('loc_sub'); body=lbLocs(); }
    else { sub=t('indiv_sub'); body=lbPlayers(); }
    return `<div class="wrap"><div class="section-h"><div><div class="eyebrow">${t('nav_lb')}</div><div class="h2">${t('seg_'+ (lbTab==='depts'?'depts':lbTab==='locs'?'locs':'players'))}</div><div class="muted" style="font-size:13px;margin-top:3px;max-width:62ch">${sub}</div></div>${seg}</div>${body}</div>${footer()}`;
  }
  function lbPlayers() {
    const ind=individual(); const top=ind.slice(0,3); const meId=me()?me().id:null;
    const podium=`<div class="podium stagger">${[1,0,2].map(ri=>{const r=top[ri];if(!r)return'<div></div>';const medal=['🥇','🥈','🥉'][ri];const cls=['p1','p2','p3'][ri];return`<div class="pod ${cls}"><div class="medal">${medal}</div>${avatarEl(r.p)}<div class="pnm">${esc(nm(r.p))}</div><div class="ppts">${r.pts}</div><div class="pillar">#${r.rank}</div></div>`;}).join('')}</div>`;
    const rows=ind.slice(0,60).map(r=>leaderRow(r,meId)).join('');
    const myRow=meId?ind.find(r=>r.p.id===meId):null; const meStrip=(myRow&&myRow.rank>60)?`<div style="margin-top:10px">${leaderRow(myRow,meId)}</div>`:'';
    return `${podium}<div class="lb-head"><span>#</span><span>${t('col_player')}</span><span style="text-align:end">${t('col_pts')}</span></div><div class="lb">${rows}</div>${meStrip}`;
  }
  function leaderRow(r, meId) {
    const you=r.p.id===meId; let mv='';
    if (prevRanks && prevRanks[r.p.id]!=null){ const d=prevRanks[r.p.id]-r.rank; mv=d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv down">▼${-d}</span>`:`<span class="mv same">·</span>`; }
    return `<div class="lb-row ${you?'you':''}"><div class="rank">${r.rank}${mv}</div><div class="who">${avatarEl(r.p)}<div class="nm"><b>${esc(nm(r.p))}${you?' • '+(L()==='ar'?'أنت':'You'):''}</b>${deptChip(deptMap[r.p.deptId])}</div></div><div class="pts">${r.pts}<small> ${t('pts')}</small>${r.exact?` <small style="color:var(--gold)">★${r.exact}</small>`:''}</div></div>`;
  }
  function lbDepts() {
    const ds=departments(); const myDept=me()?me().deptId:null;
    const rows=ds.ranked.map(r=>{ const w=Math.max(6,Math.round(r.avg/(ds.maxAvg||1)*100)); const mine=r.d.id===myDept;
      return `<div class="dept-row ${mine?'you':''}" data-dept="${r.d.id}"><div class="rank">${r.rank}</div><div class="row" style="gap:11px;min-width:0"><div class="dept-crest" style="background:${r.d.color};color:${textOn(r.d.color)}">${esc((nm(r.d)||'•').trim().slice(0,2))}</div><div class="dept-meta" style="min-width:0"><b>${esc(nm(r.d))}${mine?' • '+(L()==='ar'?'إدارتك':'Yours'):''}</b><small>${r.n} ${t('players_n')} · ★${r.exact}</small></div></div><div class="avg-bar-wrap"><div class="avg-bar"><i style="width:${w}%;background:linear-gradient(90deg,${r.d.color},var(--acc1))"></i></div></div><div class="avg-val">${r.avg.toFixed(1)}<small>${t('avg_player')}</small></div></div>`; }).join('');
    const pend=ds.pending.length?`<div class="muted" style="margin-top:16px;font-size:12.5px">${ds.pending.length} ${L()==='ar'?'إدارة تحتاج 3 مشاركين على الأقل':'departments need ≥3 players'}</div>`:'';
    return `<div class="lb stagger">${rows}</div>${pend}`;
  }
  function lbLocs() {
    const ls=locations(); const myLoc=me()?me().locationId:null; const show=ls.rows.slice(0,30);
    const rows=show.map(r=>{ const w=Math.max(6,Math.round(r.sum/(ls.maxSum||1)*100)); const mine=r.l.id===myLoc; const crest=(r.l.code||'').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'•';
      return `<div class="dept-row ${mine?'you':''}"><div class="rank">${r.rank}</div><div class="row" style="gap:11px;min-width:0"><div class="dept-crest" style="background:${r.l.color};color:${textOn(r.l.color)};font-size:11px">${esc(crest)}</div><div class="dept-meta" style="min-width:0"><b>${esc(locName(r.l))}${mine?' • '+(L()==='ar'?'موقعك':'Yours'):''}</b><small>${locCity(r.l)?esc(locCity(r.l))+' · ':''}${r.n} ${t('players_n')}</small></div></div><div class="avg-bar-wrap"><div class="avg-bar"><i style="width:${w}%;background:linear-gradient(90deg,${r.l.color},var(--acc2))"></i></div></div><div class="avg-val">${r.sum}<small>${t('total_pts')}</small></div></div>`; }).join('');
    const more=ls.rows.length>show.length?`<div class="muted" style="margin-top:16px;font-size:12.5px">+ ${ls.rows.length-show.length} ${t('more_locs')}</div>`:'';
    return `<div class="lb stagger">${rows}</div>${more}`;
  }
  function viewDeptDetail() {
    const d=deptMap[selDept]; const mem=SEED.participants.filter(p=>p.deptId===selDept).map(p=>({p,...ppoints(p.id)})).sort((a,b)=>b.pts-a.pts||b.exact-a.exact);
    const avg=mem.length?mem.reduce((a,b)=>a+b.pts,0)/mem.length:0;
    const rows=mem.slice(0,40).map((r,i)=>`<div class="lb-row ${me()&&r.p.id===me().id?'you':''}"><div class="rank">${i+1}</div><div class="who">${avatarEl(r.p)}<div class="nm"><b>${esc(nm(r.p))}</b></div></div><div class="pts">${r.pts}<small> ${t('pts')}</small></div></div>`).join('');
    return `<div class="wrap"><div class="section-h"><div class="row" style="gap:12px"><button class="btn btn-ghost btn-sm" data-action="dept-back">‹ ${t('back')}</button><div class="row" style="gap:11px"><div class="dept-crest" style="background:${d.color};color:${textOn(d.color)}">${esc((nm(d)||'•').slice(0,2))}</div><div><div class="h2">${esc(nm(d))}</div><div class="muted" style="font-size:13px">${mem.length} ${t('players_n')} · ${avg.toFixed(1)} ${t('avg_player')}</div></div></div></div></div><div class="h3" style="margin:6px 0 12px">${t('top_in')}</div><div class="lb">${rows}</div></div>${footer()}`;
  }

  /* ---- news / articles / comments ---- */
  function viewNews() {
    if (selArticle != null) return viewArticle();
    const arts=(SEED.articles||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
    const cards=arts.map(a=>`<div class="article-card" data-article="${a.id}"><div class="article-cover">${a.cover||'📰'}</div><div class="body"><div class="wk">${t('week_label')} ${a.week} · ${fmtDate(a.date)}</div><h3>${esc(L()==='ar'?a.title_ar:a.title_en)}</h3><p>${esc(L()==='ar'?a.excerpt_ar:a.excerpt_en)}</p><div class="by">${t('by')} ${esc(L()==='ar'?a.author_ar:a.author_en)} · ${commentCount(a.id)} ${t('comments_n')}</div></div></div>`).join('');
    const general = commentsBlock(null);
    return `<div class="wrap"><div class="section-h"><div><div class="eyebrow">${t('nav_news')}</div><div class="h2">${t('news_title')}</div><div class="muted" style="font-size:13px;margin-top:3px">${t('news_sub')}</div></div></div>
      <div class="news-grid stagger">${cards}</div>
      <div class="section-h" style="margin-top:34px"><div class="h2">💬 ${t('discussion')}</div></div>${general}</div>${footer()}`;
  }
  function viewArticle() {
    const a=(SEED.articles||[]).find(x=>x.id===selArticle); if(!a) { selArticle=null; return viewNews(); }
    return `<div class="wrap"><div class="section-h"><button class="btn btn-ghost btn-sm" data-action="news-back">‹ ${t('back')}</button></div>
      <div class="article-full"><div class="article-cover">${a.cover||'📰'}</div>
      <div class="wk" style="color:var(--blue);font-weight:800;font-size:12px;text-transform:uppercase">${t('week_label')} ${a.week} · ${fmtDate(a.date)} · ${t('by')} ${esc(L()==='ar'?a.author_ar:a.author_en)}</div>
      <h1 class="h2" style="margin:8px 0 16px">${esc(L()==='ar'?a.title_ar:a.title_en)}</h1>
      <p class="bd">${esc(L()==='ar'?a.body_ar:a.body_en)}</p><hr class="divider"/>
      <div class="h3" style="margin-bottom:6px">💬 ${commentCount(a.id)} ${t('comments_n')}</div>${commentsBlock(a.id)}</div></div>${footer()}`;
  }
  function allComments(){ return (SEED.comments||[]).concat(S.myComments||[]); }
  const commentCount = (aid) => allComments().filter(c=>c.articleId===(aid||null) && !S.hiddenComments.includes(c.id)).length;
  function commentsBlock(articleId) {
    const list = allComments().filter(c=>c.articleId===(articleId||null)).filter(c=>!S.hiddenComments.includes(c.id)).sort((a,b)=>(a.daysAgo||0)-(b.daysAgo||0));
    const form = me()? `<div class="comment-form"><input class="input" id="cmt-input" placeholder="${t('add_comment_ph')}"/><button class="btn btn-primary" data-action="post-comment" data-article="${articleId||''}">${t('post')}</button></div>` : `<div class="muted" style="font-size:13px;margin:10px 0">${L()==='ar'?'انضم للبطولة عشان تعلّق':'Join the cup to comment'}</div>`;
    const items = list.map(c=>commentEl(c)).join('') || `<div class="empty" style="padding:24px">${L()==='ar'?'كن أول من يعلّق':'Be the first to comment'}</div>`;

  function commentEl(c) {
    const p = c.authorId!=null? partMap.get(c.authorId):null;

  }

      <div class="row" style="gap:22px"><div class="center"><div class="num" style="font-size:28px;color:var(--gold)">${my.pts}</div><div class="muted" style="font-size:11px">${t('your_pts')}</div></div><div class="center"><div class="num" style="font-size:28px;color:color-mix(in srgb,var(--mint) 70%,var(--ink))">${my.exact}</div><div class="muted" style="font-size:11px">${t('exact_hits')}</div></div><div class="center"><div class="num" style="font-size:28px">${predCount(me().id)}</div><div class="muted" style="font-size:11px">${t('col_preds')}</div></div></div></div>
      <div class="h3" style="margin:6px 0 12px">${t('me_preds')}</div><div class="lb">${items||`<div class="empty">${t('no_preds')}</div>`}</div></div>${footer()}`;

    const rows=list.map(r=>{ const st=r.last<=2?'on':r.last<=7?'idle':'off'; const stl=st==='on'?t('status_on'):st==='idle'?t('status_idle'):t('status_off');

    const mod=all.map(c=>{ const hidden=S.hiddenComments.includes(c.id); const p=c.authorId!=null?partMap.get(c.authorId):null;
      return `<div class="comment ${hidden?'hidden-c':''}"><div>${p?avatarEl(p):`<div class="avatar" style="background:var(--acc1)">?</div>`}</div><div class="c-body"><div class="c-top"><b>${esc(L()==='ar'?(c.author_ar||c.author_en):(c.author_en||c.author_ar))}</b><span class="t">${ago(c.daysAgo||0)}</span>${hidden?`<span class="modtag">${t('hidden_label')}</span>`:''}</div><div class="c-text">${esc(c.text)}</div><div class="c-actions">${hidden?`<button data-action="unhide" data-cid="${c.id}">↩ ${t('restore')}</button>`:`<button class="del" data-action="hidec" data-cid="${c.id}">⊘ ${t('hide')}</button>`}</div></div></div>`; }).join('');
    const modCard=`<div class="card pad" style="margin-top:16px"><div class="h3" style="margin-bottom:10px">🛡️ ${t('moderation_title')}</div><div class="comments">${mod}</div></div>`;
    return `<div class="wrap"><div class="section-h"><div><div class="eyebrow">${t('nav_admin')}</div><div class="h2">${t('admin_title')}</div><div class="muted" style="font-size:13px;margin-top:3px">${t('admin_sub')}</div></div></div>${stats}${fun}${activityCard}${modCard}</div>${footer()}`;

        <div class="rule-block"><h3>🏆 ${L()==='ar'?'ثلاثة مستويات للمنافسة':'Three levels of competition'}</h3><ul>
          <li><b>${t('seg_players')}:</b> ${L()==='ar'?'مجموع نقاطك الشخصية.':'your total personal points.'}</li>
          <li><b>${t('seg_depts')}:</b> ${L()==='ar'?'متوسط النقاط لكل مشارك في الإدارة (عدل بين الإدارات الكبيرة والصغيرة).':'average points per participant (fair across team sizes).'}</li>
          <li><b>${t('seg_locs')}:</b> ${L()==='ar'?'إجمالي نقاط جميع الموظفين في الموقع.':'total points of all employees at the site.'}</li></ul></div>

        <div class="rule-block"><h3>🤝 ${L()==='ar'?'روح المنافسة':'Fair play'}</h3><p>${L()==='ar'?'الفعالية لتعزيز التفاعل والروح الجماعية. الجوائز تُمنح للفائزين في نهاية البطولة على المستويات الثلاثة.':'This is about engagement and team spirit. Prizes go to the winners across all three levels at the end of the tournament.'}</p></div>
      </div></div>${footer()}`;

  function guardJoin(){ return `<div class="wrap"><div class="card pad reveal" style="margin-top:40px;text-align:center"><div class="h2">${t('join_title')}</div><div class="muted" style="margin:8px 0 18px">${t('join_sub')}</div><button class="btn btn-primary" data-nav="home">${t('cta_join')}</button></div></div>`; }
  function footer(){ const f=SEED.meta.anonymized?t('foot_anon'):t('foot'); return `<div class="foot wrap"><div>${f}</div><div style="margin-top:8px;opacity:.7">${nm(SEED.meta.tournament)} · ${L()==='ar'?SEED.meta.nowLabel_ar:SEED.meta.nowLabel_en}</div></div>`; }

  /* ======================================================= chrome */
  function header() {
    const tabs=[['home','nav_home','🏠'],['predict','nav_predict','⚽'],['lb','nav_lb','🏆'],['news','nav_news','📰'],['me','nav_me','🪪'],['admin','nav_admin','🛡️']];
    const tabsHtml=tabs.map(([v,k,ic])=>`<button class="tab ${view===v?'active':''}" data-nav="${v}"><span class="ic">${ic}</span>${t(k)}</button>`).join('');
    const accents=['jisr','royal','sunset','pitch']; const accCol={jisr:'#42DCCC',royal:'#7C5CFF',sunset:'#FF7A45',pitch:'#1FA85C'};
    const sw=accents.map(a=>`<span class="sw ${S.accent===a?'on':''}" data-accent="${a}" style="background:${accCol[a]}" title="${a}"></span>`).join('');
    const idtag=me()?`<div class="idtag" data-action="change-id">${avatarEl(me())}<div class="meta"><b>${esc(nm(me()))}</b><small>${esc(nm(deptMap[me().deptId]))}</small></div></div>`:'';
    return `<div class="topbar"><div class="wrap">
      <div class="brand" data-nav="home"><div class="crest">⚽</div><b>${t('brand')}</b></div>
      <div class="sync-chip"><span class="dot"></span>${t('synced')} · ${SEED.meta.departmentsSynced} ${t('dept_unit')}</div>
      <div class="grow"></div>
      <div class="swatches">${sw}</div>
      <button class="toolbtn" data-action="theme" title="theme">${S.theme==='light'?'🌙 '+t('theme_d'):'☀️ '+t('theme_l')}</button>
      <button class="toolbtn" data-action="lang">${L()==='ar'?'EN':'عربي'}</button>
      ${idtag}
    </div></div>
    <div class="topbar" style="position:sticky;top:64px;border-top:0"><div class="wrap"><div class="tabs">${tabsHtml}</div></div></div>`;
  }
  function director() {
    const next=SEED.matches.filter(m=>m.status==='upcoming').sort((a,b)=>a.kickoffKSA.localeCompare(b.kickoffKSA))[0];
    const inner=next?(()=>{ const H=team(next.home),A=team(next.away); return `<div class="next-match"><div class="muted" style="font-size:11px;margin-bottom:8px">${t('next_match')} · ${t('group')} ${next.group}</div><div class="row between"><div class="center" style="flex:1"><div style="font-size:26px">${H.flag}</div><div style="font-size:12px;font-weight:700">${esc(H.code)}</div></div><div class="stepper" data-dirmatch="${next.id}"><button class="step-btn" data-dstep="-1" data-side="h">−</button><div class="step-val" data-dval="h">1</div><button class="step-btn" data-dstep="1" data-side="h">+</button><span class="muted" style="margin:0 4px">:</span><button class="step-btn" data-dstep="-1" data-side="a">−</button><div class="step-val" data-dval="a">0</div><button class="step-btn" data-dstep="1" data-side="a">+</button></div><div class="center" style="flex:1"><div style="font-size:26px">${A.flag}</div><div style="font-size:12px;font-weight:700">${esc(A.code)}</div></div></div></div>
      <div class="dir-actions"><button class="btn btn-gold" data-action="dir-confirm" data-match="${next.id}">✓ ${t('confirm_res')}</button><div class="dir-row"><button class="btn" data-action="dir-random" data-match="${next.id}">🎲 ${t('finish_rand')}</button><button class="btn" data-action="dir-md">⏭ ${t('advance_md')}</button></div><button class="btn btn-ghost" data-action="dir-reset" style="justify-content:center">↺ ${t('reset_demo')}</button></div>`; })():`<div class="empty" style="padding:20px">${t('no_upcoming')}</div><button class="btn btn-ghost" data-action="dir-reset" style="width:100%;justify-content:center">↺ ${t('reset_demo')}</button>`;
    return `<button class="director-toggle" data-action="dir-toggle" title="${t('director')}">🎬</button><div class="director ${directorOpen?'open':''}"><h4>🎬 ${t('director')}</h4><div class="sub">${t('director_sub')}</div>${inner}</div>`;
  }

  /* ======================================================= render */
  function body() {
    switch (view) {
      case 'predict': return viewPredict();
      case 'lb': return viewLeaderboard();
      case 'news': return viewNews();
      case 'me': return viewMe();
      case 'admin': return viewAdmin();
      case 'rules': return viewRules();
      default: return viewHome();
    }
  }
  function render() {
    document.documentElement.lang=L(); document.documentElement.dir=L()==='ar'?'rtl':'ltr';
    document.documentElement.setAttribute('data-theme', S.theme);
    document.documentElement.setAttribute('data-accent', S.accent);
    document.getElementById('app').innerHTML = header()+`<main>${body()}</main>`+director();
    countUp(); window.scrollTo({top:0});
  }
  function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{ const tg=+el.getAttribute('data-count'),dur=900,t0=performance.now(); (function s(now){const k=Math.min(1,(now-t0)/dur);el.textContent=Math.round(tg*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s);})(t0); }); }

  /* ======================================================= events */
  document.addEventListener('click', (e) => {
    const el=e.target.closest('[data-nav],[data-action],[data-md],[data-pick],[data-dept],[data-article],[data-lb],[data-accent],[data-step],[data-dstep],[data-cid]');
    if(!el) return;
    if(el.dataset.nav){ view=el.dataset.nav; selDept=null; selArticle=null; render(); return; }
    if(el.dataset.md){ selMd=+el.dataset.md; render(); return; }
    if(el.dataset.lb){ lbTab=el.dataset.lb; render(); return; }
    if(el.dataset.pick){ pickId(el.dataset.pick); return; }
    if(el.dataset.dept){ selDept=+el.dataset.dept; render(); return; }
    if(el.dataset.article){ selArticle=+el.dataset.article; view='news'; render(); return; }
    if(el.dataset.accent){ S.accent=el.dataset.accent; save(); render(); return; }
    if(el.dataset.step){ stepPredict(el); return; }
    if(el.dataset.dstep){ stepDir(el); return; }
    const a=el.dataset.action;
    if(a==='lang'){ S.lang=L()==='ar'?'en':'ar'; save(); render(); }
    else if(a==='theme'){ S.theme=S.theme==='light'?'dark':'light'; save(); render(); }
    else if(a==='scroll-join'){ const n=document.getElementById('join-anchor'); n&&n.scrollIntoView({behavior:'smooth'}); }
    else if(a==='create-id'){ createId(); }
    else if(a==='change-id'){ S.meId=null; save(); view='home'; render(); }
    else if(a==='dept-back'){ selDept=null; render(); }
    else if(a==='news-back'){ selArticle=null; render(); }
    else if(a==='goto-rules'){ view='rules'; render(); }
    else if(a==='rules-back'){ view='home'; render(); }
    else if(a==='post-comment'){ postComment(el.dataset.article||null); }
    else if(a==='like'){ const id=+el.dataset.cid; S.likes[id]=!S.likes[id]; save(); render(); }
    else if(a==='hidec'){ S.hiddenComments.push(+el.dataset.cid); save(); render(); }
    else if(a==='unhide'){ S.hiddenComments=S.hiddenComments.filter(x=>x!==+el.dataset.cid); save(); render(); }
    else if(a==='dir-toggle'){ directorOpen=!directorOpen; render(); }
    else if(a==='dir-confirm'){ dirFinish(+el.dataset.match,null); }
    else if(a==='dir-random'){ dirFinish(+el.dataset.match,'random'); }
    else if(a==='dir-md'){ dirMd(); }
    else if(a==='dir-reset'){ resetDemo(); }
  });

  function pickId(id){ S.meId=isNaN(+id)?id:+id; save(); view='home'; render(); toast(t('welcome')+' '+nm(partMap.get(S.meId))); }
  function createId(){
    const name=(document.getElementById('me-name').value||'').trim();
    if(!name){ toast(L()==='ar'?'اكتب اسمك أول':'Enter your name first'); return; }
    const deptId=+document.getElementById('me-dept').value; const locId=+document.getElementById('me-loc').value;
    const color=['#42DCCC','#7FA8FF','#F4C95D','#7BE0A3','#FFB48A'][name.length%5];
    const inits=name.replace(/^(Al|ال)[\s-]?/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    S.customMe={ name_ar:name, name_en:name, deptId, locationId:locId, color, initials:inits||'★', skill:0.5, lastActiveDays:0 };
    S.meId='you'; S.myPredictions={}; SEED.predictions['you']={};
    partMap.delete('you'); const i=SEED.participants.findIndex(p=>p.id==='you'); if(i>=0) SEED.participants.splice(i,1);
    save(); applyState(); partMap=new Map(SEED.participants.map(p=>[p.id,p]));
    view='predict'; render(); toast(L()==='ar'?'يا هلا! ابدأ بتوقّع المباريات':'You\'re in! Start predicting');
  }
  function postComment(articleId){
    const inp=document.getElementById('cmt-input'); const txt=(inp&&inp.value||'').trim(); if(!txt||!me()) return;
    const id=Date.now();
    S.myComments.push({ id, articleId: articleId?+articleId:null, authorId: (typeof me().id==='number'?me().id:null), author_ar:nm(me()), author_en:nm(me()), deptId:me().deptId, text:txt, daysAgo:0, likes:0 });
    save(); render(); toast(L()==='ar'?'تم نشر تعليقك ✓':'Comment posted ✓');
  }
  function stepPredict(el){ if(!me()) return; const box=el.closest('[data-match]'); const mid=+box.dataset.match; const side=el.dataset.side; const dir=+el.dataset.step;
    const cur=SEED.predictions[me().id]?.[mid]||{h:0,a:0}; const v={h:cur.h,a:cur.a}; v[side]=Math.max(0,Math.min(15,v[side]+dir));
    SEED.predictions[me().id]=SEED.predictions[me().id]||{}; SEED.predictions[me().id][mid]=v; S.myPredictions[mid]=v; save();
    box.querySelector('[data-val="h"]').textContent=v.h; box.querySelector('[data-val="a"]').textContent=v.a;
    const foot=box.parentElement.querySelector('.match-foot .your-pred'); if(foot) foot.innerHTML=`${t('your_pred')}: <b>${v.h}–${v.a}</b>`;
  }
  function stepDir(el){ const box=el.closest('[data-dirmatch]'); const side=el.dataset.side; const dir=+el.dataset.dstep; const c=box.querySelector(`[data-dval="${side}"]`); c.textContent=Math.max(0,Math.min(15,(+c.textContent)+dir)); }

  function dirFinish(mid,mode){ const m=SEED.matches.find(x=>x.id===mid); if(!m) return; prevRanks=ranksMap(individual()); let h,a;
    if(mode==='random'){ const d=[0,0,1,1,1,2,2,3]; h=d[Math.floor(Math.random()*d.length)]; a=d[Math.floor(Math.random()*d.length)]; }
    else { const box=document.querySelector(`[data-dirmatch="${mid}"]`); h=box?+box.querySelector('[data-dval="h"]').textContent:1; a=box?+box.querySelector('[data-dval="a"]').textContent:0; }
    m.status='finished'; m.homeScore=h; m.awayScore=a; S.overrides[m.id]={status:'finished',homeScore:h,awayScore:a}; save();
    celebrate(m); if(view==='home'||view==='predict'){ view='lb'; lbTab='players'; } render();
  }
  function dirMd(){ const up=SEED.matches.filter(m=>m.status==='upcoming'); if(!up.length){ toast(t('no_upcoming')); return; } const md=Math.min(...up.map(m=>m.matchday)); prevRanks=ranksMap(individual());
    SEED.matches.filter(m=>m.status==='upcoming'&&m.matchday===md).forEach(m=>{ const d=[0,0,1,1,1,2,2,3]; m.status='finished'; m.homeScore=d[Math.floor(Math.random()*d.length)]; m.awayScore=d[Math.floor(Math.random()*d.length)]; S.overrides[m.id]={status:'finished',homeScore:m.homeScore,awayScore:m.awayScore}; });
    save(); view='lb'; lbTab='players'; render(); toast(L()==='ar'?`اكتملت ${t('md')} ${md}`:`${t('md')} ${md} complete`);
  }
  function celebrate(m){ const H=team(m.home),A=team(m.away); toast(`${t('result_in')} ${H.flag} ${m.homeScore}–${m.awayScore} ${A.flag}`); if(!me()) return; const pr=(SEED.predictions[me().id]||{})[m.id]; if(!pr) return; const r=matchPoints(pr,m);
    if(r.kind==='exact'){ setTimeout(()=>toast(t('you_exact'),'gold'),500); confetti(); } else if(r.kind==='outcome'){ setTimeout(()=>toast(t('you_out'),'gold'),500); }
    const now=ranksMap(individual()); const b=prevRanks?prevRanks[me().id]:null, af=now[me().id]; if(b&&af&&af<b) setTimeout(()=>toast(`${t('you_climb')}${af} ▲`,'gold'),1000);
  }
  function resetDemo(){ S.overrides={}; S.myPredictions={}; S.myComments=[]; S.hiddenComments=[]; S.likes={}; prevRanks=null; save(); location.reload(); }

  /* ---- toast + confetti ---- */
  let tw; function toast(msg,cls){ if(!tw){ tw=document.createElement('div'); tw.className='toast-wrap'; document.body.appendChild(tw); } const el=document.createElement('div'); el.className='toast '+(cls||''); el.innerHTML=msg; tw.appendChild(el); setTimeout(()=>el.remove(),3400); }
  function confetti(){ let c=document.getElementById('confetti'); if(!c){ c=document.createElement('canvas'); c.id='confetti'; document.body.appendChild(c); } const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; const cols=['#42DCCC','#4783FC','#F4C95D','#FF5636','#7BE0A3','#fff']; const parts=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.3,vx:(Math.random()-.5)*12,vy:Math.random()*-14-4,g:.4+Math.random()*.3,s:5+Math.random()*7,col:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6,vr:(Math.random()-.5)*.4})); let fr=0; (function loop(){ fr++; ctx.clearRect(0,0,c.width,c.height); parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); }); if(fr<130) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height); })(); }

  /* ---- init ---- */
  applyState(); partMap=new Map(SEED.participants.map(p=>[p.id,p])); render();
})();

</script>
